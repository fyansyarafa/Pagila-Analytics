version: 2

models:
    - name: silver_stream_pagila_film_detail
      columns:
      - name: film_detail_sk
        description: surrogate key for film_actor (actor_id + film_id + category_id + language_id)
        data_tests:
          - not_null
          - unique

    - name: silver_stream_pagila_address_detail
      columns:
      - name: address_detail_sk
        description: surrogate key for film_actor (address_id, city_id', country_id)
        data_tests:
          - not_null
          - unique

    - name: silver_stream_pagila_store_inventory
      columns:
      - name: store_inventory_sk
        description: surrogate key for film_actor (store_id, film_id)
        data_tests:
          - not_null
          - unique
    

    - name: silver_stream_pagila_customer_membership_detail
      columns:
      - name: customer_membership_sk
        description: surrogate key for film_actor (store_id, customer_id)
        data_tests:
          - not_null
          - unique